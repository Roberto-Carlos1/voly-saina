<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Voly Saina+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .signup-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .signup-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .signup-header h1 {
            color: #667eea;
            font-size: 2rem;
            font-weight: 700;
        }
        .signup-header p {
            color: #666;
            font-size: 0.9rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .alert {
            border-radius: 8px;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .password-requirements {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="signup-header">
            <h1>Créer un compte</h1>
            <p>Rejoignez Voly Saina+ gratuitement</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}">Erreur</span>
        </div>

        <form th:action="@{/signup}" method="post" th:object="${utilisateur}">
            <div class="mb-3">
                <label for="nom" class="form-label">Nom complet *</label>
                <input type="text" class="form-control" id="nom" th:field="*{nom}" 
                       placeholder="Votre nom complet" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email *</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" 
                       placeholder="votre@email.com" required>
            </div>

            <div class="mb-3">
                <label for="telephone" class="form-label">Téléphone</label>
                <input type="tel" class="form-control" id="telephone" th:field="*{telephone}" 
                       placeholder="034 XX XXX XX">
            </div>

            <div class="mb-3">
                <label for="motDePasse" class="form-label">Mot de passe *</label>
                <input type="password" class="form-control" id="motDePasse" th:field="*{motDePasse}" 
                       placeholder="Votre mot de passe" required minlength="6">
                <div class="password-requirements">Minimum 6 caractères</div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirmer le mot de passe *</label>
                <input type="password" class="form-control" id="confirmPassword" 
                       placeholder="Confirmez votre mot de passe" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">S'inscrire</button>
        </form>

        <div class="login-link">
            <p>Déjà un compte ? <a th:href="@{/login}">Se connecter</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Validation des mots de passe
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('motDePasse').value;
            const confirmPassword = this.value;
            
            if (password !== confirmPassword) {
                this.setCustomValidity('Les mots de passe ne correspondent pas');
            } else {
                this.setCustomValidity('');
            }
        });
    </script>
</body>
</html>
