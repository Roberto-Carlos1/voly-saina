<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Détail réservation</title>
</head>
<body>

<h2>📄 Détail de la réservation</h2>

<div style="border:1px solid #ddd;padding:15px;margin:10px;border-radius:5px;">
    <p><strong>ID:</strong> <span th:text="${reservation.idReservation}"></span></p>
    <p><strong>Machine:</strong> <span th:text="${reservation.machine.nom}"></span></p>
    <p><strong>Type:</strong> <span th:text="${reservation.machine.typeMachine.libelle}"></span></p>
    <p><strong>Description:</strong> <span th:text="${reservation.machine.description}"></span></p>
    <p><strong>Prix/Jour:</strong> <span th:text="${#numbers.formatDecimal(reservation.machine.prixJour, 0, 'COMMA', 2, 'POINT')}"></span> MGA</p>
    <p><strong>Date début:</strong> <span th:text="${#temporals.format(reservation.dateDebut, 'dd/MM/yyyy')}"></span></p>
    <p><strong>Date fin:</strong> <span th:text="${#temporals.format(reservation.dateFin, 'dd/MM/yyyy')}"></span></p>
    <p><strong>Lieu livraison:</strong> <span th:text="${reservation.lieuLivraison}"></span></p>
    <p><strong>Prix total:</strong> <span th:text="${#numbers.formatDecimal(reservation.prixTotal, 0, 'COMMA', 2, 'POINT')}"></span> MGA</p>
    <p><strong>Statut:</strong> <span th:text="${reservation.statutReservation.libelle}"></span></p>
    <p><strong>Date création:</strong> <span th:text="${#temporals.format(reservation.dateCreation, 'dd/MM/yyyy HH:mm')}"></span></p>
</div>

<div th:if="${retour}" style="border:1px solid #ddd;padding:15px;margin:10px;border-radius:5px;">
    <h3>📦 Retour</h3>
    <p><strong>Date retour:</strong> <span th:text="${#temporals.format(retour.dateRetour, 'dd/MM/yyyy')}"></span></p>
    <p><strong>État:</strong> <span th:text="${retour.etatRetour}"></span></p>
    <p><strong>Pénalité:</strong> <span th:text="${#numbers.formatDecimal(retour.penalite, 0, 'COMMA', 2, 'POINT')}"></span> MGA</p>
    <p th:if="${retour.remarque}"><strong>Remarque:</strong> <span th:text="${retour.remarque}"></span></p>
</div>

<br>
<a th:href="@{/client/reservations/mes-reservations(clientId=${clientId})}">Retour à mes réservations</a>

</body>
</html>
