<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(pageTitle='Nouvelle Réservation - VolySaina+')}">
</head>
<body>
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="pt-20">
        <div class="max-w-[768px] mx-auto px-margin-desktop py-stack-lg">
            <!-- Breadcrumb -->
            <nav class="flex items-center gap-2 mb-stack-md text-on-surface-variant font-label-sm">
                <a href="/client/accueil" class="hover:text-primary">Accueil</a>
                <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                <a href="/catalogue/machines/catalogue" class="hover:text-primary">Catalogue</a>
                <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                <span class="text-on-surface font-semibold">Nouvelle réservation</span>
            </nav>

            <!-- Machine Info -->
            <div id="machineInfo" class="bg-white border border-outline-variant rounded-xl p-6 mb-6">
                <div class="flex items-center gap-4">
                    <div class="w-20 h-20 rounded-xl bg-surface-container-high flex items-center justify-center overflow-hidden">
                        <span class="material-symbols-outlined text-outline text-[40px]">agriculture</span>
                    </div>
                    <div>
                        <h2 class="font-headline-md text-headline-md text-on-surface" id="nomMachine">Chargement...</h2>
                        <p class="text-secondary font-label-sm text-label-sm uppercase tracking-widest" id="typeMachine">Type</p>
                        <p class="font-headline-md text-headline-md text-primary mt-1" id="prixMachine">0 € <span class="text-label-sm font-normal text-on-surface-variant">/jour</span></p>
                    </div>
                </div>
            </div>

            <!-- Formulaire -->
            <div class="bg-white border-2 border-primary/10 rounded-xl shadow-lg p-6">
                <h2 class="font-headline-md text-headline-md text-on-surface mb-6">Informations de réservation</h2>

                <form id="reservationForm">
                    <input type="hidden" name="clientId" th:value="${clientId != null ? clientId : 1}">
                    <input type="hidden" name="machineId" th:value="${machineId}">

                    <!-- Dates -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block font-label-sm text-on-surface-variant mb-2">Date de début *</label>
                            <input type="date" id="dateDebut" name="dateDebut" 
                                   class="w-full border border-outline-variant rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" 
                                   required>
                        </div>
                        <div>
                            <label class="block font-label-sm text-on-surface-variant mb-2">Date de fin *</label>
                            <input type="date" id="dateFin" name="dateFin" 
                                   class="w-full border border-outline-variant rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" 
                                   required>
                        </div>
                    </div>

                    <!-- Lieu de livraison -->
                    <div class="mb-4">
                        <label class="block font-label-sm text-on-surface-variant mb-2">Lieu de livraison</label>
                        <input type="text" id="lieuLivraison" name="lieuLivraison" 
                               placeholder="Ex: Antananarivo, Ambohimanga..." 
                               class="w-full border border-outline-variant rounded-lg px-4 py-3 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                    </div>

                    <!-- Résumé -->
                    <div id="resumeContainer" class="bg-surface-container-low p-4 rounded-lg mb-4" style="display:none;">
                        <h4 class="font-label-md text-label-md text-on-surface mb-2">Résumé</h4>
                        <div class="flex justify-between">
                            <span class="font-body-md text-body-md text-on-surface-variant">Nombre de jours</span>
                            <span class="font-body-md text-body-md font-bold" id="nbJours">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-body-md text-body-md text-on-surface-variant">Total</span>
                            <span class="font-headline-md text-headline-md text-primary" id="totalEstime">0 €</span>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="flex flex-col sm:flex-row gap-3">
                        <button type="submit" id="btnReserver" class="flex-1 bg-primary text-on-primary py-4 rounded-lg font-headline-md hover:bg-primary-container transition-all btn-primary flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">event_available</span>
                            Réserver
                        </button>
                        <button type="button" id="ajouterPanierBtn" 
                                class="flex-1 bg-secondary text-on-secondary py-4 rounded-lg font-headline-md hover:opacity-90 transition-all btn-primary flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined">add_shopping_cart</span>
                            Ajouter au panier
                        </button>
                        <a href="/catalogue/machines/catalogue" class="px-6 py-4 border border-outline-variant rounded-lg font-label-md text-center hover:bg-surface-container transition-all flex items-center justify-center gap-2">
                            Annuler
                        </a>
                    </div>
                </form>

                <!-- Message -->
                <div id="message" class="mt-4"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:inline="javascript">
        // Récupération des paramètres
        const machineId = /*[[${machineId}]]*/ 1;
        const clientId = /*[[${clientId != null ? clientId : 1}]]*/ 1;
        let prixJour = 0;
        let machineNom = '';
        let machineType = '';

        // Charger les infos de la machine
        function loadMachine() {
            const infoDiv = document.getElementById('machineInfo');
            infoDiv.innerHTML = '<div class="text-center py-4"><span class="material-symbols-outlined animate-spin text-primary text-4xl">sync</span><p class="mt-2">Chargement...</p></div>';
            
            fetch('/catalogue/machines/api/' + machineId)
                .then(r => {
                    if (!r.ok) throw new Error('Erreur HTTP ' + r.status);
                    return r.json();
                })
                .then(data => {
                    machineNom = data.nom || 'Machine inconnue';
                    machineType = data.typeMachine || 'Type inconnu';
                    prixJour = data.prixJour || 0;
                    
                    document.getElementById('nomMachine').textContent = machineNom;
                    document.getElementById('typeMachine').textContent = machineType;
                    document.getElementById('prixMachine').innerHTML = prixJour + ' € <span class="text-label-sm font-normal text-on-surface-variant">/jour</span>';
                    
                    // Mettre à jour le résumé
                    calculerTotal();
                })
                .catch(err => {
                    console.error('❌ Erreur:', err);
                    document.getElementById('machineInfo').innerHTML = `
                        <div class="border border-error-container bg-error-container/10 p-4 rounded-lg text-on-error-container">
                            ❌ Impossible de charger la machine : ${err.message}
                            <button onclick="loadMachine()" class="ml-4 bg-primary text-on-primary px-4 py-2 rounded-lg btn-primary">
                                Réessayer
                            </button>
                        </div>
                    `;
                });
        }

        // Calculer le total
        function calculerTotal() {
            const dateDebut = document.getElementById('dateDebut').value;
            const dateFin = document.getElementById('dateFin').value;
            const resumeContainer = document.getElementById('resumeContainer');
            const messageDiv = document.getElementById('message');

            if (!dateDebut || !dateFin || prixJour === 0) {
                resumeContainer.style.display = 'none';
                return;
            }

            const debut = new Date(dateDebut);
            const fin = new Date(dateFin);
            
            if (fin <= debut) {
                messageDiv.innerHTML = `
                    <div class="border border-error-container bg-error-container/10 p-3 rounded-lg text-on-error-container flex items-center gap-2">
                        <span class="material-symbols-outlined">warning</span>
                        La date de fin doit être postérieure à la date de début.
                    </div>
                `;
                resumeContainer.style.display = 'none';
                return;
            }

            const jours = Math.ceil((fin - debut) / (1000 * 60 * 60 * 24));
            if (jours === 0) {
                // Minimum 1 jour
                const total = prixJour;
                document.getElementById('nbJours').textContent = '1';
                document.getElementById('totalEstime').textContent = total + ' €';
            } else {
                const total = jours * prixJour;
                document.getElementById('nbJours').textContent = jours;
                document.getElementById('totalEstime').textContent = total + ' €';
            }
            
            resumeContainer.style.display = 'block';
            messageDiv.innerHTML = '';
        }

        // Vérifier la disponibilité
        function verifierDisponibilite(dateDebut, dateFin) {
            return fetch('/catalogue/reservations/api/verifier-disponibilite', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    machineId: machineId,
                    dateDebut: dateDebut,
                    dateFin: dateFin
                })
            })
            .then(r => r.json());
        }

        // Événements pour le calcul
        document.getElementById('dateDebut').addEventListener('change', function() {
            document.getElementById('dateFin').min = this.value;
            calculerTotal();
        });
        document.getElementById('dateFin').addEventListener('change', calculerTotal);

        // Définir date min (aujourd'hui)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateDebut').min = today;
        document.getElementById('dateFin').min = today;

        // Soumettre le formulaire (Réserver)
        document.getElementById('reservationForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const dateDebut = document.getElementById('dateDebut').value;
            const dateFin = document.getElementById('dateFin').value;
            const lieuLivraison = document.getElementById('lieuLivraison').value;
            const messageDiv = document.getElementById('message');
            const btnReserver = document.getElementById('btnReserver');

            if (!dateDebut || !dateFin) {
                messageDiv.innerHTML = `
                    <div class="border border-error-container bg-error-container/10 p-3 rounded-lg text-on-error-container flex items-center gap-2">
                        <span class="material-symbols-outlined">warning</span>
                        Veuillez sélectionner les dates de location.
                    </div>
                `;
                return;
            }

            const data = {
                clientId: clientId,
                machineId: machineId,
                dateDebut: dateDebut,
                dateFin: dateFin,
                lieuLivraison: lieuLivraison || ''
            };

            btnReserver.disabled = true;
            btnReserver.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> En cours...';
            messageDiv.innerHTML = '';

            // Vérifier la disponibilité avant d'envoyer
            verifierDisponibilite(dateDebut, dateFin)
                .then(dispo => {
                    if (!dispo.disponible) {
                        throw new Error('Cette machine n\'est pas disponible sur cette période.');
                    }
                    return fetch('/catalogue/reservations/api', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                })
                .then(r => {
                    if (!r.ok) throw new Error('Erreur serveur');
                    return r.json();
                })
                .then(data => {
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    
                    messageDiv.innerHTML = `
                        <div class="border border-primary-container bg-primary-container/10 p-4 rounded-lg text-primary">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                                <span class="font-bold">${data.message || 'Réservation créée avec succès !'}</span>
                            </div>
                            <div class="mt-2 flex flex-wrap gap-3">
                                <a href="/catalogue/reservations/mes-reservations?clientId=${clientId}" 
                                   class="bg-primary text-on-primary px-4 py-2 rounded-lg font-label-md hover:opacity-90 transition">
                                    Voir mes réservations
                                </a>
                                <a href="/catalogue/reservations/${data.reservation?.idReservation || ''}" 
                                   class="border border-primary text-primary px-4 py-2 rounded-lg font-label-md hover:bg-primary/10 transition">
                                    Voir le détail
                                </a>
                            </div>
                        </div>
                    `;
                    document.getElementById('reservationForm').style.opacity = '0.6';
                    btnReserver.style.display = 'none';
                })
                .catch(err => {
                    console.error('❌ Erreur:', err);
                    messageDiv.innerHTML = `
                        <div class="border border-error-container bg-error-container/10 p-3 rounded-lg text-on-error-container flex items-center gap-2">
                            <span class="material-symbols-outlined">error</span>
                            ❌ ${err.message}
                        </div>
                    `;
                    btnReserver.disabled = false;
                    btnReserver.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">event_available</span> Réserver';
                });
        });

        // Ajouter au panier
        document.getElementById('ajouterPanierBtn')?.addEventListener('click', function() {
            const dateDebut = document.getElementById('dateDebut').value;
            const dateFin = document.getElementById('dateFin').value;
            const lieuLivraison = document.getElementById('lieuLivraison').value;
            const messageDiv = document.getElementById('message');
            const btn = this;

            if (!dateDebut || !dateFin) {
                messageDiv.innerHTML = `
                    <div class="border border-error-container bg-error-container/10 p-3 rounded-lg text-on-error-container flex items-center gap-2">
                        <span class="material-symbols-outlined">warning</span>
                        Veuillez sélectionner les dates de location.
                    </div>
                `;
                return;
            }

            const data = {
                clientId: clientId,
                machineId: machineId,
                dateDebut: dateDebut,
                dateFin: dateFin,
                lieuLivraison: lieuLivraison || ''
            };

            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Ajout en cours...';
            messageDiv.innerHTML = '';

            // Vérifier la disponibilité
            verifierDisponibilite(dateDebut, dateFin)
                .then(dispo => {
                    if (!dispo.disponible) {
                        throw new Error('Cette machine n\'est pas disponible sur cette période.');
                    }
                    return fetch('/panier/reservations/api/ajouter', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });
                })
                .then(r => {
                    if (!r.ok) throw new Error('Erreur serveur');
                    return r.json();
                })
                .then(response => {
                    if (response.error) {
                        throw new Error(response.error);
                    }
                    
                    messageDiv.innerHTML = `
                        <div class="border border-primary-container bg-primary-container/10 p-4 rounded-lg text-primary">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                                <span class="font-bold">${response.message || 'Réservation ajoutée au panier !'}</span>
                            </div>
                            <div class="mt-2 flex flex-wrap gap-3">
                                <a href="/panier?clientId=${clientId}" 
                                   class="bg-primary text-on-primary px-4 py-2 rounded-lg font-label-md hover:opacity-90 transition">
                                    Voir mon panier
                                </a>
                                <a href="/catalogue/machines/catalogue" 
                                   class="border border-primary text-primary px-4 py-2 rounded-lg font-label-md hover:bg-primary/10 transition">
                                    Continuer les achats
                                </a>
                            </div>
                        </div>
                    `;
                    btn.style.display = 'none';
                })
                .catch(err => {
                    console.error('❌ Erreur:', err);
                    messageDiv.innerHTML = `
                        <div class="border border-error-container bg-error-container/10 p-3 rounded-lg text-on-error-container flex items-center gap-2">
                            <span class="material-symbols-outlined">error</span>
                            ❌ ${err.message}
                        </div>
                    `;
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-symbols-outlined">add_shopping_cart</span> Ajouter au panier';
                });
        });

        // Charger au démarrage
        loadMachine();

        console.log('🔍 Machine ID:', machineId);
        console.log('🔍 Client ID:', clientId);
    </script>
</body>
</html>
