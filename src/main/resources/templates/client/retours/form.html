<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Retourner</title>
</head>
<body>

    <h1>🔄 Retourner une machine</h1>

    <div id="infoReservation">
        <p>⏳ Chargement des informations...</p>
    </div>

    <form id="formRetour" style="display:none;">
        <div>
            <label><strong>État de la machine:</strong></label><br>
            <input type="radio" name="etatRetour" value="bon" checked> Bon état<br>
            <input type="radio" name="etatRetour" value="use"> Usure normale<br>
            <input type="radio" name="etatRetour" value="endommage"> Endommagé<br>
            <input type="radio" name="etatRetour" value="casse"> Cassé<br>
            <input type="radio" name="etatRetour" value="perdu"> Perdu
        </div>
        <br>
        <div>
            <label>Remarque:</label><br>
            <textarea name="remarque" rows="3" cols="40"></textarea>
        </div>
        <br>
        <button type="submit">Enregistrer</button>
        <button type="button" onclick="window.location.href='/client/reservations/mes-reservations?clientId=1'">Annuler</button>
    </form>

    <div id="message" style="margin-top:20px;"></div>

    <script>
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function getReservationIdFromPath() {
            const path = window.location.pathname;
            const parts = path.split('/');
            return parts[3] || null;
        }

        const reservationId = getReservationIdFromPath() || getUrlParam('id') || 1;
        const clientId = getUrlParam('clientId') || 1;

        console.log('🔍 Reservation ID:', reservationId);
        console.log('🔍 Client ID:', clientId);

        // ✅ Timeout pour éviter le chargement infini
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 secondes max

        // Charger les informations avec timeout
        fetch('/client/retours/api/form/' + reservationId, {
            signal: controller.signal
        })
            .then(r => {
                clearTimeout(timeoutId);
                if (!r.ok) throw new Error('Erreur HTTP ' + r.status);
                return r.json();
            })
            .then(data => {
                console.log('📦 Données reçues:', data);
                
                if (data.error) {
                    document.getElementById('infoReservation').innerHTML = '❌ ' + data.error;
                    return;
                }
                
                // Afficher les informations
                document.getElementById('infoReservation').innerHTML = `
                    <div style="border:1px solid #ccc;padding:15px;margin:10px;border-radius:5px;">
                        <h3>${data.machineNom}</h3>
                        <p><strong>Type:</strong> ${data.machineType}</p>
                        <p><strong>Période:</strong> ${data.dateDebut} au ${data.dateFin}</p>
                        <p><strong>Prix total:</strong> ${data.prixTotal} MGA</p>
                        ${data.estRetard ? '<p style="color:red;">⚠️ Retard: ' + data.joursRetard + ' jour(s) - Pénalité: ' + data.penaliteRetard + ' MGA</p>' : ''}
                        <p><strong>Réservation ID:</strong> ${data.reservationId}</p>
                    </div>
                `;
                
                // Afficher le formulaire
                document.getElementById('formRetour').style.display = 'block';
            })
            .catch(err => {
                clearTimeout(timeoutId);
                console.error('❌ Erreur:', err);
                
                let message = err.message;
                if (err.name === 'AbortError') {
                    message = '⏱️ Le serveur ne répond pas. Veuillez réessayer.';
                }
                
                document.getElementById('infoReservation').innerHTML = `
                    <div style="border:1px solid red;padding:15px;margin:10px;border-radius:5px;background:#f8d7da;">
                        <h3 style="color:red;">❌ Erreur</h3>
                        <p>${message}</p>
                        <button onclick="location.reload()" 
                                style="padding:8px 15px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer;">
                            🔄 Réessayer
                        </button>
                    </div>
                `;
                
                // Afficher le formulaire quand même pour permettre l'enregistrement
                document.getElementById('formRetour').style.display = 'block';
            });

        // Envoyer le retour
        document.getElementById('formRetour').onsubmit = function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                reservationId: Number(reservationId),
                etatRetour: formData.get('etatRetour'),
                remarque: formData.get('remarque') || ''
            };

            console.log('📤 Envoi:', data);

            document.getElementById('message').innerHTML = '⏳ Envoi en cours...';

            fetch('/client/retours/api', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => {
                if (!r.ok) throw new Error('Erreur HTTP ' + r.status);
                return r.json();
            })
            .then(data => {
                console.log('📦 Réponse:', data);
                
                if (data.error) {
                    document.getElementById('message').innerHTML = '❌ ' + data.error;
                    return;
                }
                
                const penalite = data.retour ? data.retour.penalite : (data.penalite || 0);
                const montantTotal = data.montantTotal || 0;
                
                document.getElementById('message').innerHTML = `
                    <div style="border:1px solid green;padding:15px;background:#d4edda;border-radius:5px;">
                        <h3 style="color:green;">✅ ${data.message}</h3>
                        <p><strong>Pénalité:</strong> ${penalite} MGA</p>
                        <p><strong>Total à payer:</strong> ${montantTotal} MGA</p>
                        <br>
                        <button onclick="window.location.href='/client/reservations/mes-reservations?clientId=${clientId}'" 
                                style="padding:8px 15px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer;">
                            Voir mes réservations
                        </button>
                    </div>
                `;
                document.getElementById('formRetour').style.display = 'none';
            })
            .catch(err => {
                console.error('❌ Erreur:', err);
                document.getElementById('message').innerHTML = '❌ Erreur: ' + err.message;
            });
        };
    </script>

</body>
</html>
