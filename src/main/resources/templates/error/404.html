<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page non trouvée (404) - Voly Saina</title>
    <style>
        body{ font-family: Arial, Helvetica, sans-serif; background:#fff; color:#333; }
        .wrap{ max-width:800px; margin:80px auto; text-align:center }
        h1{ font-size:48px; color:#f39c12; margin-bottom:6px }
        p{ font-size:18px; color:#555 }
        a{ display:inline-block; margin-top:18px; padding:10px 14px; background:#337ab7; color:#fff; border-radius:6px; text-decoration:none }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>404</h1>
        <p>Désolé — la page que vous cherchez est introuvable.</p>
        <p th:if="${path}">Vérifiez l'adresse : <strong th:text="${path}">/chemin</strong></p>
        <a href="/">Aller à l'accueil</a>
    </div>
</body>
</html>
