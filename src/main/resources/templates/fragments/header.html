    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff8f2;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #faf2eb; }
        ::-webkit-scrollbar-thumb { background: #707a6f; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #004c22; }
        
        .status-badge {
            transition: all 0.3s ease;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
        .btn-primary {
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        
        /* ===== STYLES POUR LE SOULIGNEMENT ===== */
        .nav-link {
            position: relative;
            padding-bottom: 4px;
            transition: color 0.3s ease;
            text-decoration: none;
            cursor: pointer;
        }
        /* La ligne de soulignement */
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background-color: #0d7106ff; /* Couleur orange/marron */
            transition: width 0.3s ease;
        }
        /* Au survol - la ligne apparaît */
        .nav-link:hover::after {
            width: 100%;
        }
        /* Quand la page est active - la ligne reste visible ET changement de couleur */
        .nav-link.active {
            color: #046513ff !important; /* Orange/marron */
            font-weight: 600 !important;
        }
        .nav-link.active::after {
            width: 100% !important;
            background-color: #046513ff !important;
        }
        /* Couleur par défaut */
        .nav-link:not(.active) {
            color: #404940;
        }
        .nav-link:not(.active):hover {
            color: #004c22;
        }
        /* ===== FIN STYLES SOULIGNEMENT ===== */
    </style>
    <title th:text="${pageTitle} ?: 'VolySaina+'">VolySaina+</title>
</head>

<body>
    <!-- Header Navigation -->

                    Voly Saina +
                </a>
                <div class="hidden md:flex gap-6 items-center">
                    <a href="/guide-plantation" class="nav-link font-label-md text-primary font-bold transition-colors duration-200" data-page="guide-plantation">

                    </a>
                    <a href="/catalogue/machines/catalogue" class="nav-link font-label-md text-label-md transition-colors duration-200" data-page="machines">

                    <a href="/catalogue/produits/catalogue" class="nav-link font-label-md text-label-md transition-colors duration-200" data-page="produits">

    <!-- Script pour activer le soulignement en fonction de l'URL -->
    <script>
        (function() {
            // Fonction pour déterminer la page active
            function setActiveNav() {
                const currentPath = window.location.pathname;
                
                // Sélectionner tous les liens de navigation
                const navLinks = document.querySelectorAll('.nav-link');
                
                // Retirer la classe active de tous les liens
                navLinks.forEach(function(link) {
                    link.classList.remove('active');
                });
                
                // Déterminer quel lien doit être actif
                let activePage = '';
                if (currentPath.startsWith('/catalogue/machines')) {
                    activePage = 'machines';
                } else if (currentPath.startsWith('/catalogue/produits')) {
                    activePage = 'produits';
                } else if (currentPath.startsWith('/catalogue/reservations')) {
                    activePage = 'reservations';
                }
                
                // Ajouter la classe active au lien correspondant
                if (activePage) {
                    navLinks.forEach(function(link) {
                        if (link.getAttribute('data-page') === activePage) {
                            link.classList.add('active');
                        }
                    });
                }
            }
            
            // Exécuter au chargement de la page
            setActiveNav();
            
            // Réexécuter après chaque navigation (pour les SPA)
            window.addEventListener('popstate', setActiveNav);
            
            // Optionnel: observer les changements d'URL
            if (window.history && window.history.pushState) {
                const originalPushState = window.history.pushState;
                window.history.pushState = function() {
                    originalPushState.apply(this, arguments);
                    setActiveNav();
                };
                
                const originalReplaceState = window.history.replaceState;
                window.history.replaceState = function() {
                    originalReplaceState.apply(this, arguments);
                    setActiveNav();
                };
            }
        })();
    </script>
</body>
