<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f7efe9",
                        "on-primary-fixed": "#00210b",
                        "secondary-fixed": "#ffdbcb",
                        "on-tertiary-fixed-variant": "#6d391e",
                        "error-container": "#ffdad6",
                        "surface": "#fff8f2",
                        "surface-container": "#f4ede6",
                        "surface-bright": "#fff8f2",
                        "on-primary-container": "#93e0a2",
                        "on-secondary-fixed": "#341000",
                        "on-primary-fixed-variant": "#005226",
                        "on-error": "#ffffff",
                        "on-surface": "#1e1b17",
                        "on-tertiary-container": "#ffc1a4",
                        "primary-fixed-dim": "#8bd79b",
                        "surface-variant": "#e8e1db",
                        "on-error-container": "#93000a",
                        "surface-dim": "#e0d9d2",
                        "on-secondary": "#ffffff",
                        "primary": "#004c22",
                        "surface-container-lowest": "#ffffff",
                        "surface-tint": "#1f6c3a",
                        "surface-container-high": "#eee7e0",
                        "on-tertiary-fixed": "#351000",
                        "tertiary-fixed-dim": "#ffb694",
                        "inverse-primary": "#8bd79b",
                        "tertiary-container": "#81492d",
                        "on-secondary-container": "#712c00",
                        "inverse-surface": "#33302c",
                        "tertiary-fixed": "#ffdbcc",
                        "primary-container": "#166534",
                        "on-secondary-fixed-variant": "#7a3000",
                        "tertiary": "#653319",
                        "primary-fixed": "#a6f4b5",
                        "on-surface-variant": "#404940",
                        "outline": "#707a6f",
                        "surface-container-low": "#faf2eb",
                        "outline-variant": "#bfc9bd",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "background": "#fff8f2",
                        "secondary": "#9a4614",
                        "secondary-fixed-dim": "#ffb693",
                        "on-background": "#1e1b17",
                        "surface-container-highest": "#e8e1db",
                        "secondary-container": "#fd925b"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "gutter-mobile": "16px",
                        "gutter-desktop": "24px",
                        "base": "4px",
                        "margin-mobile": "20px",
                        "margin-desktop": "48px",
                        "stack-lg": "32px"
                    },
                    fontFamily: {
                        "headline-md": ["Inter"],
                        "headline-xl": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-xl-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    fontSize: {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "headline-xl": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-xl-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
    
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fff8f2;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #faf2eb; }
        ::-webkit-scrollbar-thumb { background: #707a6f; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #004c22; }
        
        .status-badge {
            transition: all 0.3s ease;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }
        .btn-primary {
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: scale(0.98);
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
    </style>
    <title th:text="${pageTitle} ?: 'AgriElite'">AgriElite</title>
</head>

<body>
    <!-- Header Navigation -->
    <header th:fragment="header" class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant shadow-sm h-20">
        <nav class="max-w-[1280px] mx-auto px-margin-desktop flex justify-between items-center h-full">
            <!-- Logo -->
            <div class="flex items-center gap-8">
                <a href="/client/accueil" class="font-headline-md text-headline-md text-primary tracking-tight font-extrabold text-[32px] hover:opacity-80 transition-opacity">
                    Voly Saina +
                </a>
                <div class="hidden md:flex gap-6 items-center">
                    <a href="/catalogue/machines/catalogue" class="font-label-md text-label-md text-secondary border-b-2 border-secondary pb-1">
                        Matériel Agricole
                    </a>
                    <a href="/catalogue/produits/catalogue" class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200">
                        Équipements &amp; Pièces
                    </a>
                    <a href="/catalogue/reservations/mes-reservations" class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200">
                        Mes Réservations
                    </a>
                </div>
            </div>
            
            <!-- Right Side -->
            <div class="flex items-center gap-4">
                <div class="hidden lg:flex relative">
                    <input class="bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2 w-64 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" 
                           placeholder="Rechercher une machine..." type="text">
                    <span class="material-symbols-outlined absolute right-3 top-2.5 text-outline">search</span>
                </div>
                <a href="/client/profil" class="bg-primary text-on-primary px-6 py-2 rounded-lg font-label-md hover:opacity-90 transition-opacity flex items-center gap-2">
                    <span class="material-symbols-outlined text-[20px]">person</span>
                    Mon Compte
                </a>
            </div>
        </nav>
    </header>
</body>
</html>
