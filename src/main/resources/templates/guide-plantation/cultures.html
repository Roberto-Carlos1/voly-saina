<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Guide de plantation</title>
</head>
<body>
<h1>Guide de plantation</h1>

<form method="get" th:action="@{/guide-plantation/cultures}">
    <label>
        Mot-clé
        <input type="text" name="motCle" th:value="${filtres.motCle}" placeholder="Nom ou description">
    </label>
    <label>
        Localisation
        <select name="localisation">
            <option value="">Toutes</option>
            <option th:each="localisationDisponible : ${localisationsDisponibles}"
                    th:value="${localisationDisponible}"
                    th:text="${localisationDisponible}"
                    th:selected="${localisationDisponible == filtres.localisation}">
                Localisation
            </option>
        </select>
    </label>
    <label>
        Saison
        <select name="saison">
            <option value="">Toutes</option>
            <option th:each="saisonDisponible : ${saisonsDisponibles}"
                    th:value="${saisonDisponible}"
                    th:text="${saisonDisponible}"
                    th:selected="${saisonDisponible == filtres.saison}">
                Saison
            </option>
        </select>
    </label>
    <label>
        Tri
        <select name="tri" onchange="this.form.submit()">
            <option value="nom_asc" th:selected="${tri == 'nom_asc'}">Nom A-Z</option>
            <option value="nom_desc" th:selected="${tri == 'nom_desc'}">Nom Z-A</option>
        </select>
    </label>
    <label>
        Taille page
        <input type="number" name="size" min="1" max="100" th:value="${size}">
    </label>
    <button type="submit">Filtrer</button>
    <a th:href="@{/guide-plantation/cultures}">Réinitialiser</a>
</form>

<p>
    <a th:href="@{/guide-plantation/cultures/export/pdf(
        motCle=${filtres.motCle},
        localisation=${filtres.localisation},
        saison=${filtres.saison},
        page=${culturesPage.number},
        size=${size},
        tri=${tri}
    )}">Exporter PDF</a>
    <a th:href="@{/guide-plantation/cultures/export/excel(
        motCle=${filtres.motCle},
        localisation=${filtres.localisation},
        saison=${filtres.saison},
        page=${culturesPage.number},
        size=${size},
        tri=${tri}
    )}">Exporter Excel</a>
</p>

<p th:text="'Résultats : ' + ${culturesPage.totalElements}">Résultats</p>

<p th:if="${#lists.isEmpty(cultures)}">Aucune culture disponible.</p>

<table th:if="${!#lists.isEmpty(cultures)}" border="1">
    <thead>
    <tr>
        <th>Nom</th>
        <th>Description</th>
        <th>Localisation adaptée</th>
        <th>Saison adaptée</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="culture : ${cultures}">
        <td th:text="${culture.nom}">Nom</td>
        <td th:text="${culture.description}">Description</td>
        <td th:text="${culture.localisationRecommandee}">Localisation</td>
        <td th:text="${culture.saisonRecommandee}">Saison</td>
        <td>
            <a th:href="@{/guide-plantation/cultures/{id}(
                id=${culture.idCulture},
                motCle=${filtres.motCle},
                localisation=${filtres.localisation},
                saison=${filtres.saison},
                page=${culturesPage.number},
                size=${size},
                tri=${tri}
            )}">Détail</a>
            <a th:href="@{/guide-plantation/cultures/{id}/fiche(
                id=${culture.idCulture},
                motCle=${filtres.motCle},
                localisation=${filtres.localisation},
                saison=${filtres.saison},
                page=${culturesPage.number},
                size=${size},
                tri=${tri}
            )}">Fiche</a>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${culturesPage.totalPages > 1}">
    <a th:if="${culturesPage.hasPrevious()}" th:href="@{/guide-plantation/cultures(
        motCle=${filtres.motCle},
        localisation=${filtres.localisation},
        saison=${filtres.saison},
        page=${culturesPage.number - 1},
        size=${size},
        tri=${tri}
    )}">Précédent</a>

    <span th:text="'Page ' + ${culturesPage.number + 1} + ' / ' + ${culturesPage.totalPages}">Page</span>

    <a th:if="${culturesPage.hasNext()}" th:href="@{/guide-plantation/cultures(
        motCle=${filtres.motCle},
        localisation=${filtres.localisation},
        saison=${filtres.saison},
        page=${culturesPage.number + 1},
        size=${size},
        tri=${tri}
    )}">Suivant</a>
</p>
</body>
</html>
