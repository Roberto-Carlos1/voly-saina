<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Guide de plantation</title>
</head>
<body>
<div align="right">
    <a th:href="@{/guide-plantation/fiche-culture}">
        <button type="button">Page 04</button>
    </a>
</div>

<h1>Guide de plantation</h1>

<form method="get" th:action="@{/guide-plantation/cultures}">
    <label>
        Nom
        <input type="text" name="nom" th:value="${filtres.nom}">
    </label>
    <label>
        Localisation
        <input type="text" name="localisation" th:value="${filtres.localisation}">
    </label>
    <label>
        Région
        <input type="text" name="region" th:value="${filtres.region}">
    </label>
    <label>
        Saison
        <input type="text" name="saison" th:value="${filtres.saison}">
    </label>
    <label>
        Description
        <input type="text" name="description" th:value="${filtres.description}">
    </label>
    <button type="submit">Filtrer</button>
    <a th:href="@{/guide-plantation/cultures}">Réinitialiser</a>
</form>

<p th:if="${#lists.isEmpty(cultures)}">Aucune culture disponible.</p>

<table th:if="${!#lists.isEmpty(cultures)}" border="1">
    <thead>
    <tr>
        <th>Nom</th>
        <th>Description</th>
        <th>Région / localisation adaptée</th>
        <th>Saison adaptée</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="culture : ${cultures}">
        <td th:text="${culture.nom}">Nom</td>
        <td th:text="${culture.description}">Description</td>
        <td th:text="${culture.localisationRecommandee}">Localisation</td>
        <td th:text="${culture.saisonRecommandee}">Saison</td>
        <td>
            <a th:href="@{/guide-plantation/cultures/{id}(id=${culture.idCulture})}">Détail</a>
            <a th:href="@{/guide-plantation/cultures/{id}/fiche(id=${culture.idCulture})}">Fiche</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
