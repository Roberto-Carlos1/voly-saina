<!DOCTYPE html>
<html lang="en">

<head>
    <p th:text="${derniersStatuts}"></p>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machines</title>
</head>

<body>
    <a href="/api/machines/view/insert">Inserer une machine</a>
    <h1>Liste des machines</h1>
    <p th:if="${success}" th:text="${success}"></p>
    <p th:if="${error}" th:text="${error}"></p>

    <h3>Filtre</h3>
    <form action="/api/machines/pages" method="post">
        <p>
            Éléments par page
            <input type="number" name="pages" id="">
            <input type="submit" value="Afficher">
        </p>
    </form>

    <form id="filtreForm">
        <p>Nom machine <input type="text" name="nomMachine" placeholder="toyota">

            Etat machine
            <select name="etatMachine" id="">
                <option value="">Vide</option>
                <option th:each="etat : ${etatMachine}" th:value="${etat.getIdEtatMachine()}"
                    th:text="${etat.getLibelle()}"></option>
            </select>

            Type machine
            <select name="typeMachine" id="">
                <option value="">Vide</option>
                <option th:each="type : ${types}" th:value="${type.getIdTypeMachine()}" th:text="${type.getLibelle()}">
                </option>
            </select>

            <button type="submit">Filtrer</button>
        </p>

    </form>

    <table border="1">
        <tr>
            <th>Nom machine</th>
            <th>Type machine</th>
            <th>Etat</th>
            <th>Action</th>
        </tr>

        <tbody id="machineLines">
            <tr th:each="machine : ${machines}">
                <td th:text=${machine.getNom()}></td>
                <td th:text=${machine.getTypeMachine().getLibelle()}></td>
                <td>
                    <span th:if="${derniersStatuts.containsKey(machine.idMachine)}"
                        th:text="${derniersStatuts[machine.idMachine].etatMachine.libelle}">
                    </span>

                    <span th:unless="${derniersStatuts.containsKey(machine.idMachine)}">
                        Aucun statut
                    </span>
                </td>
                <td>
                    <a th:href="@{/api/machines/{id_machine}(id_machine=${machine.getIdMachine()})}">Voir plus</a>
                    <a th:href="@{/api/machines/modify/{id_machine}(id_machine=${machine.getIdMachine()})}">Modifier</a>
                    <a
                        th:href="@{/api/machines/delete/{id_machine}(id_machine=${machine.getIdMachine()})}">Supprimer</a>
                </td>
            </tr>
        </tbody>


    </table>

    <div>
        <a th:if="${currentPage > 0}" th:href="@{/api/machines(page=${currentPage - 1})}"> Précédent </a>

        <span> Page <strong th:text="${currentPage + 1}">1</strong> sur <strong th:text="${totalPages}">X</strong>
        </span>

        <a th:if="${currentPage + 1 < totalPages}" th:href="@{/api/machines(page=${currentPage + 1})}"> Suivant </a>
    </div>
</body>

<script>
    const form = document.getElementById("filtreForm")
    form.addEventListener("submit", function (event) {
        event.preventDefault();
        console.log("Pas de rechargement")

        const data = new FormData(form)
        const lines = document.getElementById("machineLines")
        lines.innerHTML = ""


        fetch("/api/machines/filtre", {
            method: "POST",
            body: data
        })

            .then(response => response.json())
            .then(machines => {
                console.log(machines)

                machines.forEach(machine => {
                    var line = document.createElement("tr");

                    // On utilise innerHTML et les accents graves (``) pour injecter la variable
                    line.innerHTML = `<td>${machine.nom}</td>
                          <td>${machine.typeMachine.libelle}</td>
                          <td>${machine.etatMachine.libelle}</td>
                          <td><a href="/api/machines/${machine.idMachine}">Voir plus</a> 
                            <a href="/api/machines/modify/${machine.idMachine}">Modifier</a>
                        <a href="/api/machines/delete/${machine.idMachine}">Supprimer</a></td>`;

                    lines.appendChild(line);
                });
            })
    });
</script>

</html>
