<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machines</title>
</head>

<body>
    <a href="/machines/ajouter">Inserer une machine</a>
    <a href="/api/exel/template/Machine">Télécharger le template d'importation</a>
    <a href="/files">Allez a la page d'importation</a>
    <h1>Liste des machines</h1>
    <p th:if="${success}" th:text="${success}"></p>
    <p th:if="${error}" th:text="${error}"></p>

    <h3>Filtre</h3>
    <form action="/machines/pages" method="post">
        <p>
            Éléments par page
            <input type="number" name="pages" id="">
            <input type="submit" value="Afficher">
        </p>
    </form>

    <form id="filtreForm">
        <p>Nom machine <input type="text" name="nomMachine" placeholder="toyota">

            Etat machine
            <select name="etatMachine" id="">
                <option value="">Vide</option>
                <option th:each="etat : ${etatMachine}" th:value="${etat.getIdEtatMachine()}"
                    th:text="${etat.getLibelle()}"></option>
            </select>

            Type machine
            <select name="typeMachine" id="">
                <option value="">Vide</option>
                <option th:each="type : ${types}" th:value="${type.getIdTypeMachine()}" th:text="${type.getLibelle()}">
                </option>
            </select>

            <button type="submit">Filtrer</button>
        </p>
        <input type="hidden" name="page" value="0" id="numeroPage">
    </form>

    <table border="1">
        <tr>
            <th>Nom machine</th>
            <th>Type machine</th>
            <th>Etat</th>
            <th>Action</th>
        </tr>

        <tbody id="machineLines">
            <tr th:each="machine : ${machines}">
                <td th:text=${machine.getNom()}></td>
                <td th:text=${machine.getTypeMachine().getLibelle()}></td>
                <td>
                    <span th:if="${derniersStatuts.containsKey(machine.idMachine)}"
                        th:text="${derniersStatuts[machine.idMachine].etatMachine.libelle}">
                    </span>

                    <span th:unless="${derniersStatuts.containsKey(machine.idMachine)}">
                        Aucun statut
                    </span>
                </td>
                <td>
                    <a th:href="@{/machines/{id_machine}(id_machine=${machine.getIdMachine()})}">Voir plus</a>
                    <a th:href="@{/machines/modifier/{id_machine}(id_machine=${machine.getIdMachine()})}">Modifier</a>
                    <a
                        th:href="@{/machines/supprimer/{id_machine}(id_machine=${machine.getIdMachine()})}">Supprimer</a>
                </td>
            </tr>
        </tbody>


    </table>

    <div id="paginationButtons">
        <button type="button" id="btnPrecedent">Précédent</button>
        <span id="infoPage" th:text="'Page 1 sur ' + ${totalPages}"></span>
        <button type="button" id="btnSuivant">Suivant</button>
    </div>

</body>

<script>
    const form = document.getElementById("filtreForm");
    const numeroPageInput = document.getElementById("numeroPage");
    const lines = document.getElementById("machineLines");

    function chargerMachines(pageCible) {
        numeroPageInput.value = pageCible;

        const data = new FormData(form);
        lines.innerHTML = ""; // Vider le tableau

        fetch("/machines/api/filtre", {
            method: "POST",
            body: data
        })
            .then(response => response.json())
            .then(pageSpring => {
                pageSpring.content.forEach(machine => {
                    var line = document.createElement("tr");
                    const libelleType = machine.typeMachine ? machine.typeMachine.libelle : 'Aucun';
                    const libelleEtat = machine.etatMachine ? machine.etatMachine.libelle : 'Aucun statut';

                    line.innerHTML = `
                <td>${machine.nom}</td>
                <td>${libelleType}</td>
                <td>${libelleEtat}</td>
                <td>
                    <a href="/machines/${machine.idMachine}">Voir plus</a> 
                    <a href="/machines/modifier/${machine.idMachine}">Modifier</a>
                    <a href="/machines/supprimer/${machine.idMachine}">Supprimer</a>
                </td>`;
                    lines.appendChild(line);
                });

                // 2. Mise à jour visuelle des infos de pagination
                if (pageSpring.number < pageSpring.totalPages) {
                    document.getElementById("infoPage").textContent = `Page ${pageSpring.number + 1} sur ${pageSpring.totalPages}`;
                }

                // Gestion de l'activation/désactivation des boutons
                document.getElementById("btnPrecedent").disabled = pageSpring.first;
                document.getElementById("btnSuivant").disabled = pageSpring.last;
            });
    }

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        chargerMachines(0);
    });

    document.getElementById("btnSuivant").addEventListener("click", function () {
        let pageActuelle = parseInt(numeroPageInput.value, 10);
        chargerMachines(pageActuelle + 1);
    });

    document.getElementById("btnPrecedent").addEventListener("click", function () {
        let pageActuelle = parseInt(numeroPageInput.value, 10);
        if (pageActuelle > 0) {
            chargerMachines(pageActuelle - 1);
        }
    });
</script>

</html>
