<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation maintenance</title>
</head>

<body>
    <a href="/api/maintenances-machine">Retour à la liste</a>
    <h1>Validation de la maintenance</h1>

    <p th:if="${error}" th:text="${error}" style="color: red;"></p>

    <div th:if="${maintenance != null}">
        <p><strong>Machine :</strong> <span th:text="${maintenance.getMachine().getNom()}"></span></p>
        <p><strong>Travaux :</strong> <span th:text="${maintenance.getTravaux()}"></span></p>
        <p><strong>Date début :</strong> <span th:text="${maintenance.getDateDebut()}"></span></p>
        <p><strong>Date retour prévue :</strong> <span th:text="${maintenance.getDateRetourPrevue()}"></span></p>
        <p><strong>Coût :</strong> <span th:text="${maintenance.getCout()}"></span> Ar</p>

        <form th:action="@{/api/maintenances-machine/validate}" method="post">
            <input type="hidden" name="idMaintenance" th:value="${maintenance.idMaintenance}">
            <label for="dateRetourReelle">Date retour réelle *</label>
            <input type="date" id="dateRetourReelle" name="dateRetourReelle"
                   th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
            <br><br>
            <button type="submit">Valider la maintenance</button>
            <a href="/api/maintenances-machine">Annuler</a>
        </form>
    </div>
</body>

</html>
